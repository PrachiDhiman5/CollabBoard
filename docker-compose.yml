services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: "5000"
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    expose:
      - "5000"

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
